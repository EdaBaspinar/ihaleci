services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ihaleci_postgres
    environment:
      POSTGRES_USER: ihaleci
      POSTGRES_PASSWORD: ihaleci_local_dev
      POSTGRES_DB: ihaleci
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ihaleci"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: ihaleci_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pg_data:
  redis_data: